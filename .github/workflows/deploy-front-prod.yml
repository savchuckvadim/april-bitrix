name: Deploy front (prod, per-app)

# Схема как в back/deploy-monorepo.yml:
#  - detect: определяет изменённые приложения (dorny/paths-filter);
#  - build:  matrix собирает/пушит в GHCR ТОЛЬКО изменённые apps
#            (+ registry-кэш слоёв — при неизменном lockfile быстро);
#  - deploy: на сервере pull + up -d ТОЛЬКО изменённых apps, с ожиданием
#            healthcheck (без сборки на сервере и без слепых sleep).
# Изменение в packages/**, lockfile и т.п. (фильтр shared) осознанно
# пересобирает ВСЕ apps — общий код шарится между ними.
#
# Настройки репо (Settings → Secrets and variables → Actions):
#  - secrets: ONLINE_API_KEY (инлайнится в бандлы при сборке),
#             GHCR_PAT (read:packages — pull приватных образов на сервере),
#             SERVER_IP / SERVER_USER / SERVER_SSH_KEY.
# Несекретные build-time значения (урлы и т.п.) заданы в APP_CFG ниже.

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "Dockerfile.prod"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-front-prod.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: 'Что собрать вручную: "all" или список через пробел/запятую (напр. "bitrix admin"). Пусто = all.'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write # push образов в ghcr.io встроенным токеном

concurrency:
  group: deploy-front-prod
  cancel-in-progress: false

env:
  # Build-time конфиг приложений (несекретный: NEXT_PUBLIC_* и так попадают
  # в клиентский бандл). Значения должны совпадать с серверными apps/<app>/.env.
  # web пока исключён из деплоя — при включении вернуть его сюда,
  # в фильтры detect, в ALL и раскомментировать сервис в docker-compose.prod.yml.
  #
  # admin дополнительно требует NEXT_PUBLIC_*_API_URL (домены его бэков) —
  # они NEXT_PUBLIC и инлайнятся в клиентский бандл на сборке, поэтому
  # задаются здесь (не в runtime .env). Для остальных apps поля отсутствуют
  # → в build-args попадут пустыми и игнорируются.
  APP_CFG: |
    {
      "admin":         { "app_url": "https://back.april-app.ru",  "in_bitrix": "true",  "chromium": "false", "admin_api_url": "https://api.admin.april-app.ru/", "pbx_install_api_url": "https://api.install.april-app.ru/", "konstructor_api_url": "" },
      "bitrix":        { "app_url": "https://bitrix.april-app.ru", "in_bitrix": "true",  "chromium": "false" },
      "kpi-sales":     { "app_url": "",                            "in_bitrix": "false", "chromium": "false", "kpi_sales_api_url": "https://api.kpi-sales.april-app.ru/" },
      "kpi-service":   { "app_url": "",                            "in_bitrix": "true",  "chromium": "false" },
      "konstructor":   { "app_url": "",                            "in_bitrix": "true",  "chromium": "true"  },
      "event-sales":   { "app_url": "",                            "in_bitrix": "true",  "chromium": "true",  "event_sales_api_url": "https://api.event-sales.april-app.ru/" },
      "event-service": { "app_url": "",                            "in_bitrix": "true",  "chromium": "true"  }
    }
  WS_HOST: https://back.april-app.ru
  YANDEX_ID: "105777667"

jobs:
  # ---------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy-front-prod.yml'
            admin: ['apps/admin/**']
            bitrix: ['apps/bitrix/**']
            kpi-sales: ['apps/kpi-sales/**']
            kpi-service: ['apps/kpi-service/**']
            konstructor: ['apps/konstructor/**']
            event-sales: ['apps/event-sales/**']
            event-service: ['apps/event-service/**']

      - name: Вычислить список приложений для сборки
        id: set
        env:
          MANUAL_APPS: ${{ github.event.inputs.apps }}
          CHANGED_APPS: ${{ steps.filter.outputs.changes }}
        run: |
          ALL='["admin","bitrix","kpi-sales","kpi-service","konstructor","event-sales","event-service"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$MANUAL_APPS" ] || [ "$MANUAL_APPS" = "all" ]; then
              echo "Ручной запуск -> все приложения"
              echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            else
              ARR=$(echo "$MANUAL_APPS" | tr ', ' '\n' | sed '/^$/d' | sed 's/.*/"&"/' | paste -sd, -)
              echo "Ручной запуск -> [$ARR]"
              echo "apps=[$ARR]" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "Изменён общий код (shared) -> собираем все приложения"
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
          else
            # JSON из paths-filter передаём через env: при инлайне expression прямо
            # в echo shell съедает кавычки и матрица получает битый JSON.
            echo "apps=$CHANGED_APPS" >> "$GITHUB_OUTPUT"
          fi

      - name: Показать решение detect
        run: echo "apps=${{ steps.set.outputs.apps }}"

  # ---------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # GHCR ловит secondary rate limit, если 7 сборок одновременно пушат слои
      # (2 тега + registry-кэш mode=max на каждое приложение) — push падает с
      # 403 permission_denied «You have exceeded a secondary rate limit».
      # Ограничиваем одновременные push'и; на shared-изменениях сборка идёт
      # волнами, но не разваливается.
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR (встроенный токен, без PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа (owner в нижнем регистре — требование GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/april-front-${{ matrix.app }}" >> "$GITHUB_ENV"

      # build-args собираем один раз в $BUILD_ARGS — их читают обе попытки push
      # (см. ниже), чтобы список не разъезжался между копиями шага.
      - name: build-args для ${{ matrix.app }}
        env:
          APP_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].app_url }}
          IN_BITRIX: ${{ fromJSON(env.APP_CFG)[matrix.app].in_bitrix }}
          CHROMIUM: ${{ fromJSON(env.APP_CFG)[matrix.app].chromium }}
          ADMIN_API_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].admin_api_url }}
          PBX_INSTALL_API_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].pbx_install_api_url }}
          KONSTRUCTOR_API_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].konstructor_api_url }}
          KPI_SALES_API_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].kpi_sales_api_url }}
          EVENT_SALES_API_URL: ${{ fromJSON(env.APP_CFG)[matrix.app].event_sales_api_url }}
        run: |
          {
            echo 'BUILD_ARGS<<__ARGS_EOF__'
            echo "APP=${{ matrix.app }}"
            echo "NEXT_PUBLIC_APP_URL=$APP_URL"
            echo "NEXT_PUBLIC_WS_HOST=$WS_HOST"
            echo "NEXT_PUBLIC_IN_BITRIX=$IN_BITRIX"
            echo "IN_BITRIX=$IN_BITRIX"
            echo "YANDEX_ID=$YANDEX_ID"
            echo "WITH_CHROMIUM=$CHROMIUM"
            echo "NEXT_PUBLIC_ADMIN_API_URL=$ADMIN_API_URL"
            echo "NEXT_PUBLIC_PBX_INSTALL_API_URL=$PBX_INSTALL_API_URL"
            echo "NEXT_PUBLIC_KONSTRUCTOR_API_URL=$KONSTRUCTOR_API_URL"
            echo "NEXT_PUBLIC_KPI_SALES_API_URL=$KPI_SALES_API_URL"
            echo "NEXT_PUBLIC_EVENT_SALES_API_URL=$EVENT_SALES_API_URL"
            echo '__ARGS_EOF__'
          } >> "$GITHUB_ENV"

      - name: Build & push ${{ matrix.app }}
        id: push1
        continue-on-error: true # падение разбираем ниже: транзиентное — ретраим
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          build-args: |
            ${{ env.BUILD_ARGS }}
            ONLINE_API_KEY=${{ secrets.ONLINE_API_KEY }}
          push: true
          # provenance/sbom не нужны, а их attestation-манифесты + manifest list
          # добавляют лишние push-запросы к GHCR (плюс к rate limit)
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Secondary rate limit GHCR живёт несколько минут. Слои уже в локальном
      # кэше buildx, поэтому вторая попытка — это фактически только push.
      - name: Пауза перед повтором push
        if: steps.push1.outcome == 'failure'
        run: sleep $((RANDOM % 120 + 180)) # разводим ретраи параллельных сборок

      - name: Build & push ${{ matrix.app }} (повтор)
        if: steps.push1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          build-args: |
            ${{ env.BUILD_ARGS }}
            ONLINE_API_KEY=${{ secrets.ONLINE_API_KEY }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ---------------------------------------------------------------
  deploy:
    needs: [detect, build]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy изменённых приложений по SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APPS_JSON: ${{ needs.detect.outputs.apps }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: APPS_JSON,IMAGE_TAG,GHCR_OWNER,GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /var/www/html/next/monorepo

            # GHCR требует owner в нижнем регистре; compose читает его из env
            GHCR_OWNER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
            export GHCR_OWNER IMAGE_TAG
            COMPOSE="docker compose --env-file .env -f docker-compose.prod.yml"

            echo "🧩 Обновляю checkout (нужен свежий docker-compose.prod.yml и apps/*/.env)"
            # Deploy-клон выравниваем жёстко под ветку (без merge/divergence).
            # .env-файлы в .gitignore — reset их не трогает.
            git fetch origin main
            git reset --hard origin/main

            # compose читает env_file ВСЕХ сервисов при загрузке модели —
            # отсутствующий файл ломает деплой любого приложения. Создаём заглушки.
            for d in admin bitrix kpi-sales kpi-service konstructor event-sales event-service; do
              [ -f "apps/$d/.env" ] || { echo "⚠️ apps/$d/.env отсутствует — создаю пустой (заполни перед деплоем этого app!)"; touch "apps/$d/.env"; }
            done

            # Логин нужен только для приватных пакетов. Если PAT протух или
            # выдан не на все пакеты, GHCR отвечает "denied: denied" даже на
            # публичный образ — поэтому логин не делаем фатальным, а при
            # отказе на pull ниже пробуем анонимно.
            if [ -n "$GHCR_PAT" ]; then
              echo "🔐 Логин в GHCR"
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
                || echo "⚠️ docker login не прошёл — продолжаю анонимно"
            else
              echo "ℹ️ GHCR_PAT пуст — пропускаю docker login (образы должны быть публичными)"
            fi

            # GHCR иногда отвечает "denied: denied" на аутентифицированный
            # запрос (протухший/узко выданный PAT, вторичный rate limit), хотя
            # образ публичный. Пробуем: как есть -> пауза -> анонимно.
            pull_image () {
              local svc="$1"
              $COMPOSE pull "$svc" && return 0
              echo "⚠️ pull $svc не удался — повтор через 30s"
              sleep 30
              $COMPOSE pull "$svc" && return 0
              echo "⚠️ pull $svc снова не удался — пробую без учётки GHCR"
              docker logout ghcr.io >/dev/null 2>&1 || true
              $COMPOSE pull "$svc" && return 0
              echo "❌ pull $svc не удался"
              return 1
            }

            wait_healthy () {
              local svc="$1" cid timeout=300 elapsed=0
              cid=$($COMPOSE ps -q "$svc")
              while true; do
                local status health
                status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo missing)
                health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo unknown)
                if [ "$status" = "running" ] && { [ "$health" = "healthy" ] || [ "$health" = "none" ]; }; then
                  echo "✅ $svc: $status/$health"
                  return 0
                fi
                if [ "$elapsed" -ge "$timeout" ]; then
                  echo "❌ Таймаут $svc (status=$status health=$health)"
                  docker logs "$cid" --tail 200 || true
                  return 1
                fi
                echo "⌛ $svc status=$status health=$health (${elapsed}s)"
                sleep 5; elapsed=$((elapsed + 5))
              done
            }

            # JSON-массив -> список через пробел
            APPS=$(echo "$APPS_JSON" | tr -d '[]"' | tr ',' ' ')
            echo "🚀 Деплой приложений: $APPS (tag=$IMAGE_TAG)"

            FAILED=""; SKIPPED=""
            for app in $APPS; do
              svc="front-$app"
              # пустой .env = приложение на этом сервере ещё не настроено —
              # пропускаем без ошибки (заполни apps/$app/.env, чтобы деплоить)
              if [ ! -s "apps/$app/.env" ]; then
                echo "⚠️ apps/$app/.env пуст — пропускаю $svc"
                SKIPPED="$SKIPPED $svc"
                continue
              fi
              echo "📦 pull + up: $svc"
              # set -e не должен ронять весь цикл из-за одного приложения:
              # раньше отказ pull обрывал деплой и остальные apps молча
              # оставались на старом теге.
              if ! pull_image "$svc"; then
                FAILED="$FAILED $svc"
                continue
              fi
              if ! $COMPOSE up -d "$svc"; then
                echo "❌ up -d $svc не удался"
                FAILED="$FAILED $svc"
                continue
              fi
              wait_healthy "$svc" || FAILED="$FAILED $svc"
            done

            docker image prune -f || true
            $COMPOSE ps

            [ -n "$SKIPPED" ] && echo "⚠️ Пропущены (пустой .env):$SKIPPED"
            if [ -n "$FAILED" ]; then
              echo "❌ Не поднялись:$FAILED"
              exit 1
            fi
            echo "✅ Деплой завершён"
