# next.april-app.ru — все клиентские фронты на одном домене, каждый под своим префиксом.
# Источник правды — этот файл в репо, на сервер он копируется. Подробности,
# диагностика и установка — в README рядом.
#
#   /, /kpi-sales/  -> kpi-sales      april-kpi-sales-prod      5034  без basePath
#   /sales          -> event-sales    front-event-sales-prod    5031  basePath /sales
#   /service        -> event-service  front-event-service-prod  5038  basePath /service
#   /konstructor    -> konstructor    front-konstructor-prod    5035  basePath /konstructor
#   /kpi-service    -> kpi-service    april-kpi-service-prod    5037  basePath /kpi-service
#
# Порты — из СЕРВЕРНОГО .env, сверять по `docker ps`. app-* на 82xx — это бэки.
#
# Правила для приложений с basePath:
#  - префикс НЕ режем: корень домена занят kpi-sales, туда ушли бы /_next/* и навигация;
#  - `/<префикс>` проксируем: редирект на `/<префикс>/` даёт петлю с Next (уже ронял прод);
#  - POST на страницу -> 303 GET: Bitrix открывает обработчик POST-ом, page.tsx отвечает 405.
#    Тело теряется, это безопасно: auth и placement приложения берут из BX24-фрейма;
#  - /<префикс>/api/ вне этого правила: route-хендлерам нужен настоящий POST.
#    Появятся Server Actions — правило их сломает, обход в README.

# Имена upstream уникальны на весь nginx: повтор в другом файле роняет `nginx -t`.
upstream event_sales_app   { server 127.0.0.1:5031; keepalive 32; }
upstream event_service_app { server 127.0.0.1:5038; keepalive 32; }
upstream konstructor_app   { server 127.0.0.1:5035; keepalive 32; }
upstream kpi_service_app   { server 127.0.0.1:5037; keepalive 32; }

server {
    # NB: в `www.next-april-app.ru` дефис вместо точки — такого хоста нет,
    # блок для него мёртвый. Оставлено как в проде; чинить, когда появится DNS.
    server_name next.april-app.ru www.next-april-app.ru;

    client_max_body_size 20M;

    # Общее для приложений с basePath. Блоки kpi-sales задают всё своё сами.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ─── event-sales ───
    location ^~ /sales/api/ {
        proxy_pass http://event_sales_app;
    }
    location ~ ^/sales(/|$) {
        absolute_redirect off;
        if ($request_method = POST) { return 303 $request_uri; }
        proxy_pass http://event_sales_app;
    }

    # ─── event-service ───
    location ^~ /service/api/ {
        proxy_pass http://event_service_app;
    }
    location ~ ^/service(/|$) {
        absolute_redirect off;
        if ($request_method = POST) { return 303 $request_uri; }
        proxy_pass http://event_service_app;
    }

    # ─── konstructor (открывается из сделки и из компании; публичная ссылка: /konstructor/p/<token>) ───
    location ^~ /konstructor/api/ {
        proxy_pass http://konstructor_app;
    }
    location ~ ^/konstructor(/|$) {
        absolute_redirect off;
        if ($request_method = POST) { return 303 $request_uri; }
        proxy_pass http://konstructor_app;
    }

    # ─── kpi-service (обработчик в Bitrix: /kpi-service/report/kpi) ───
    location ^~ /kpi-service/api/ {
        proxy_pass http://kpi_service_app;
    }
    location ~ ^/kpi-service(/|$) {
        absolute_redirect off;
        if ($request_method = POST) { return 303 $request_uri; }
        proxy_pass http://kpi_service_app;
    }

    # ─── kpi-sales: /kpi-sales и / ───
    # НЕ ТРОГАТЬ — поведение как в рабочем проде. 60s — дефолт nginx: иначе
    # сюда унаследовались бы 300s с уровня server. Приложение без basePath,
    # поэтому префикс режем. Правило 303 накрывает и route-хендлеры под
    # /kpi-sales/ — оставлено по решению, см. README.

    location /kpi-sales/ {
        if ($request_method = POST) {
            return 303 /kpi-sales/report;
        }

        proxy_pass http://localhost:5034;  # внутренний контейнер Nginx
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Удалить /kpi-sales префикс при проксировании
        rewrite ^/kpi-sales(/.*)$ $1 break;
    }

    location / {
        proxy_pass http://localhost:5034/;  # внутренний контейнер Nginx
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/next.april-app.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/next.april-app.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = next.april-app.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name next.april-app.ru www.next-april-app.ru;
    return 404; # managed by Certbot


}
